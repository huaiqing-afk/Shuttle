<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<script>try{var t=localStorage.getItem('shuttle-theme')||'system';if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Shuttle · UI 还原稿 v2</title>
<style>
/* Shuttle 设计令牌 —— 夜航仪表盘：石墨蓝黑 chrome + 仪表琥珀，终端区 Tokyo Night */
:root{
  --bg0:#0D1017; --bg1:#12161F; --bg2:#181D28; --bg3:#1E2432;
  --border:#242B3A; --border-hi:#323B50;
  --text:#E8ECF4; --muted:#99A3B6; --faint:#5F6B84;
  --accent:#F0A63C; --accent-hi:#FFBC55; --accent-ink:#231604;
  --live:#5BC97F; --danger:#F07B7B;
  --term-bg:#16161E; --term-fg:#C0CAF5; --term-cursor:#7DCFFF; --term-accent:#7AA2F7;
  --term-glow:radial-gradient(720px 200px at 50% -60px,rgba(122,162,247,.07),transparent 70%);
  --tn-blue:#7AA2F7; --tn-cyan:#7DCFFF; --tn-green:#9ECE6A; --tn-yellow:#E0AF68; --tn-red:#F7768E; --tn-purple:#BB9AF7; --tn-comment:#565F89;
  --c-claude:#9DB2F5; --c-codex:#5FC9C0; --c-shell:#A9B4C7;
  --mono:"Cascadia Code","Maple Mono NF CN",Consolas,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif;
  --r-lg:10px; --r-md:8px; --r-sm:6px;
  --titlebar:linear-gradient(180deg,#141926,#10141D);
  --shadow-1:0 12px 32px rgba(0,0,0,.5); --shadow-2:0 24px 64px rgba(0,0,0,.6);
}
/* 浅色：仅界面 chrome；终端区固定 Tokyo Night 深色 */
:root[data-theme="light"]{
  --bg0:#EEF1F6; --bg1:#F7F8FB; --bg2:#E9EDF4; --bg3:#DDE3EE;
  --border:#D3DAE6; --border-hi:#B9C3D4;
  --text:#1B2233; --muted:#4E5871; --faint:#7A8599;
  --accent:#B97A12; --accent-hi:#96650A; --accent-ink:#FFF8EC;
  --live:#22854E; --danger:#C43D38;
  --c-claude:#4A63C9; --c-codex:#0E7C74; --c-shell:#5A6478;
  --titlebar:linear-gradient(180deg,#FDFEFF,#EFF2F8);
  --term-bg:#F4F5F9; --term-fg:#343B58; --term-cursor:#3760BF; --term-accent:#2E5FDE;
  --term-glow:radial-gradient(720px 200px at 50% -60px,rgba(55,96,191,.05),transparent 70%);
  --shadow-1:0 12px 32px rgba(23,32,56,.18); --shadow-2:0 24px 64px rgba(23,32,56,.28);
}
:root[data-theme="light"] .chip-claude{background:rgba(74,99,201,.12)}
:root[data-theme="light"] .chip-codex{background:rgba(14,124,116,.12)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg0);color:var(--text);font-family:var(--sans);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.35}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
svg{width:16px;height:16px;flex-shrink:0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ── 窗框 ───────────────────────────── */
.app{display:flex;flex-direction:column;height:100vh}
.titlebar{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px 0 16px;
  background:var(--titlebar);border-bottom:1px solid var(--border);user-select:none}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;letter-spacing:.02em}
.brand .mark{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;
  background:linear-gradient(135deg,var(--accent),#C77E1E);color:var(--accent-ink)}
.brand .mark svg{width:13px;height:13px}
.brand em{font-style:normal;color:var(--faint);margin-left:2px}
.ver{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--border);border-radius:99px;padding:2px 8px}
.winctl{display:flex;gap:6px;margin-left:auto}
.winctl button{display:grid;place-items:center;width:34px;height:26px;border-radius:var(--r-sm);color:var(--faint)}
.winctl button:hover{background:var(--bg3);color:var(--text)}
.winctl .close:hover{background:var(--danger);color:#1A0505}
.theme-seg{display:flex;gap:2px;margin-left:auto;margin-right:10px;padding:2px;background:var(--bg0);border:1px solid var(--border);border-radius:8px}
.theme-seg button{display:grid;place-items:center;width:27px;height:22px;border-radius:5px;color:var(--faint)}
.theme-seg button:hover{color:var(--text);background:var(--bg2)}
.theme-seg button.on{background:var(--bg3);color:var(--accent)}
.theme-seg svg{width:13px;height:13px}

.body{display:flex;flex:1;min-height:0}

/* ── 左栏：会话 ─────────────────────── */
.rail{display:flex;flex-direction:column;width:272px;min-width:272px;background:var(--bg1);border-right:1px solid var(--border)}
.rail-head{padding:14px 14px 10px}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:10px;width:14px;height:14px;color:var(--faint);pointer-events:none}
.search input{width:100%;height:34px;padding:0 10px 0 32px;font:12px/1 var(--mono);color:var(--text);
  background:var(--bg0);border:1px solid var(--border);border-radius:var(--r-md)}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--border-hi);outline:none;box-shadow:0 0 0 2px rgba(240,166,60,.15)}
.search kbd{position:absolute;right:8px;font:10px var(--mono);color:var(--faint);border:1px solid var(--border);border-radius:4px;padding:2px 5px}
.agent-filter{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.agent-filter button{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--border);border-radius:99px;font:11px var(--mono);color:var(--muted)}
.agent-filter button:hover{border-color:var(--border-hi);color:var(--text)}
.agent-filter button.on{background:var(--bg3);border-color:var(--border-hi);color:var(--text)}
.agent-filter .f-dot{width:7px;height:7px;border-radius:50%}
.agent-filter .n{color:var(--faint)}
.sessions{flex:1;overflow-y:auto;padding:4px 8px 12px}
.group{margin-top:6px}
.group-head{display:flex;align-items:center;gap:8px;width:100%;padding:8px 8px;color:var(--faint);
  font:11px var(--mono);text-align:left;border-radius:var(--r-sm)}
.group-head:hover{color:var(--muted)}
.group-head .chev{transition:transform .15s;width:12px;height:12px}
.group.open .chev{transform:rotate(90deg)}
.group-head .path{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.group-head .n{font-size:10px;border:1px solid var(--border);border-radius:99px;padding:1px 6px;color:var(--faint)}
.sess{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-md);text-align:left}
.sess:hover{background:var(--bg2)}
.sess.active{background:var(--bg3);box-shadow:inset 2px 0 0 var(--accent)}
.agent-chip{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;font:700 10px var(--mono);flex-shrink:0}
.chip-claude{background:rgba(157,178,245,.14);color:var(--c-claude)}
.chip-codex{background:rgba(95,201,192,.13);color:var(--c-codex)}
.sess-main{flex:1;min-width:0}
.sess-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-meta{display:flex;gap:8px;margin-top:3px;font:10.5px var(--mono);color:var(--faint)}
.sess-meta .st-busy{color:var(--accent)}
.sess-meta .st-idle{color:var(--live)}
.sess-meta .ag-claude{color:var(--c-claude)}
.sess-meta .ag-codex{color:var(--c-codex)}
.sess-meta .ag-powershell{color:var(--c-shell)}
.rail-empty{padding:20px 16px;color:var(--faint);font-size:12.5px;line-height:1.8}
.rail-foot{border-top:1px solid var(--border);padding:10px 14px}
.env-row{display:flex;align-items:center;gap:10px;width:100%;padding:6px 4px;border-radius:var(--r-sm);font:11px var(--mono);color:var(--muted)}
.env-row:hover{background:var(--bg2)}
.env-dots{display:flex;gap:5px}
.env-dots i{width:6px;height:6px;border-radius:50%;background:var(--faint);opacity:.4}
.env-dots i.ok{background:var(--live);opacity:1}

/* ── 主区：标签 + 终端 ─────────────── */
.main{display:flex;flex-direction:column;flex:1;min-width:0;background:var(--bg0)}
.tabstrip{display:flex;align-items:stretch;height:36px;background:var(--bg1);border-bottom:1px solid var(--border);padding:0 8px;gap:2px}
.tab{position:relative;display:flex;align-items:center;gap:8px;max-width:220px;padding:0 10px 0 12px;
  font:12px var(--mono);color:var(--muted);border-radius:var(--r-sm) var(--r-sm) 0 0}
.tab:hover{color:var(--text);background:var(--bg2)}
.tab.active{color:var(--term-fg);background:var(--term-bg)}
.tab.active::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.tab .t-dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex-shrink:0}
.tab .t-dot.run-claude{background:var(--c-claude);box-shadow:0 0 6px rgba(157,178,245,.6)}
.tab .t-dot.run-codex{background:var(--c-codex);box-shadow:0 0 6px rgba(95,201,192,.6)}
.tab .t-dot.run-powershell{background:var(--live);box-shadow:0 0 6px rgba(91,201,127,.5)}
.tab .t-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .t-x{display:grid;place-items:center;width:18px;height:18px;border-radius:4px;color:var(--faint);flex-shrink:0}
.tab .t-x:hover{background:var(--bg3);color:var(--text)}
.tab .t-x svg{width:11px;height:11px}
.tab.starting .t-title{color:var(--accent-hi)}
.tab .t-load{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden;display:none}
.tab.starting .t-load{display:block}
.tab .t-load i{display:block;height:100%;width:36%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:load 1.1s linear infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(380%)}}
.newtab{position:relative}
.newtab>button{display:grid;place-items:center;width:32px;height:28px;margin-top:4px;border-radius:var(--r-sm);color:var(--muted)}
.newtab>button:hover{background:var(--bg2);color:var(--text)}
.menu{position:absolute;top:34px;right:0;z-index:40;min-width:170px;padding:5px;background:var(--bg2);
  border:1px solid var(--border-hi);border-radius:var(--r-md);box-shadow:var(--shadow-1);display:none}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-sm);font-size:13px;text-align:left}
.menu button:hover{background:var(--bg3)}
.menu .agent-chip{width:18px;height:18px;font-size:9px}
.menu kbd{margin-left:auto;font:10px var(--mono);color:var(--faint)}

.term-wrap{position:relative;flex:1;min-height:0;background:var(--term-bg)}
#screen{height:100%;overflow-y:auto;padding:14px 16px;font:14px/1.4 var(--mono);color:var(--term-fg);white-space:pre-wrap;word-break:break-all;cursor:text}
#screen .c{display:inline-block;width:8px;height:1.15em;vertical-align:text-bottom;background:var(--term-cursor);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#screen .term-accent{color:var(--term-accent)}
#term-input{position:absolute;left:-9999px;opacity:0}
.term-empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
.term-empty .box{max-width:400px;text-align:center}
.term-empty .keys{display:flex;justify-content:center;gap:8px;margin-top:18px;flex-wrap:wrap}
.term-empty kbd{font:11px var(--mono);color:var(--muted);border:1px solid var(--border-hi);border-bottom-width:2px;border-radius:5px;padding:3px 7px;background:var(--bg1)}
.term-empty .h{font:600 15px var(--sans);color:var(--text);margin:14px 0 0}
.term-empty p{font-size:13px;line-height:1.7;color:var(--faint);margin:8px 0 0}
.term-glow{position:absolute;inset:0;pointer-events:none;background:var(--term-glow)}

.statusbar{display:flex;align-items:center;gap:16px;height:32px;padding:0 14px;background:var(--bg1);
  border-top:1px solid var(--border);font:11px var(--mono);color:var(--muted)}
.statusbar .s-dot{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.statusbar .s-dot.run{background:var(--live)}
.statusbar .spacer{flex:1}
.statusbar .tool{display:grid;place-items:center;width:24px;height:22px;border-radius:4px;color:var(--muted)}
.statusbar .tool:hover{background:var(--bg3);color:var(--text)}
.statusbar .tool svg{width:13px;height:13px}
.statusbar .val{min-width:26px;text-align:center;color:var(--faint)}
.statusbar .err{color:var(--danger);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 弹层 ──────────────────────────── */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(6,8,13,.62);backdrop-filter:blur(2px);display:none;place-items:center}
.scrim.open{display:grid}
.modal{width:min(400px,92vw);padding:22px;background:var(--bg2);border:1px solid var(--border-hi);border-radius:12px;box-shadow:var(--shadow-2)}
.modal h3{margin:0;font-size:15px;font-weight:600}
.modal p{margin:10px 0 0;font-size:13px;line-height:1.7;color:var(--muted)}
.modal .row{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 16px;
  border-radius:var(--r-md);font-size:13px;font-weight:500;transition:background .15s}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hi)}
.btn.subtle{border:1px solid var(--border-hi);color:var(--muted)}
.btn.subtle:hover{background:var(--bg3);color:var(--text)}
.btn.danger{background:var(--danger);color:#1A0505}
.toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%) translateY(8px);z-index:90;
  display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bg2);border:1px solid var(--border-hi);
  border-radius:99px;font-size:12.5px;box-shadow:var(--shadow-1);opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:14px;height:14px;color:var(--live)}

/* ── 窄屏 ──────────────────────────── */
@media(max-width:900px){
  .rail{position:absolute;z-index:50;left:0;top:41px;bottom:0;transform:translateX(-100%);transition:transform .2s;box-shadow:12px 0 32px rgba(0,0,0,.4)}
  .rail.show{transform:none}
  .railtoggle{display:grid!important}
}
.railtoggle{display:none;place-items:center;width:32px;height:26px;border-radius:var(--r-sm);color:var(--muted)}
.railtoggle:hover{background:var(--bg3);color:var(--text)}
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <button class="railtoggle" id="rail-toggle" aria-label="切换会话栏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg></button>
    <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h13"/><path d="m12 6 6 6-6 6"/></svg></span>shuttle<em>·接驳</em></div>
    <span class="ver">UI 还原稿 · 模拟数据</span>
    <div class="theme-seg" role="radiogroup" aria-label="主题模式">
      <button data-mode="system" title="跟随系统" aria-label="跟随系统"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="13" x="3" y="4" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
      <button data-mode="dark" title="深色" aria-label="深色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button data-mode="light" title="浅色" aria-label="浅色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </div>
    <div class="winctl">
      <button aria-label="最小化"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" x2="19" y1="12" y2="12"/></svg></button>
      <button aria-label="最大化"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect width="14" height="14" x="5" y="5" rx="1.5"/></svg></button>
      <button class="close" id="app-close" aria-label="关闭 Shuttle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
  </div>

  <div class="body">
    <aside class="rail" id="rail" aria-label="会话列表">
      <div class="rail-head">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="text" placeholder="搜索会话 / 工作区" aria-label="搜索会话">
          <kbd>Ctrl K</kbd>
        </div>
        <div class="agent-filter" id="agent-filter" role="group" aria-label="按 Agent 筛选"></div>
      </div>
      <div class="sessions" id="sessions"></div>
      <div class="rail-foot">
        <button class="env-row" id="env-btn" aria-label="查看本机环境">
          <span class="env-dots" id="env-dots"><i></i><i></i><i></i></span>
          <span>本机环境</span>
          <svg style="margin-left:auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </button>
      </div>
    </aside>

    <main class="main">
      <div class="tabstrip" id="tabstrip" role="tablist" aria-label="终端标签">
        <div class="newtab">
          <button id="newtab-btn" aria-label="新建终端" aria-haspopup="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <div class="menu" id="newtab-menu" role="menu">
            <button data-agent="powershell"><span class="agent-chip" style="background:rgba(169,180,199,.12);color:var(--c-shell)">PS</span>PowerShell<kbd>Ctrl T</kbd></button>
            <button data-agent="claude"><span class="agent-chip chip-claude">CL</span>Claude Code</button>
            <button data-agent="codex"><span class="agent-chip chip-codex">CX</span>Codex</button>
          </div>
        </div>
      </div>
      <div class="term-wrap" id="term-wrap">
        <div class="term-glow"></div>
        <div id="screen" aria-label="终端输出" tabindex="0"></div>
        <input id="term-input" autocomplete="off">
        <div class="term-empty" id="term-empty">
          <div class="box">
            <div class="keys"><kbd>Ctrl T</kbd><kbd>Ctrl K</kbd><kbd>Ctrl W</kbd><kbd>Ctrl ⇥</kbd></div>
            <div class="h">接上任何一个会话</div>
            <p>左侧点一条历史会话，在原工作目录接续；或 Ctrl T 开一个新终端。多个终端并行运行，互不打断。</p>
          </div>
        </div>
      </div>
      <div class="statusbar">
        <span class="s-dot" id="s-dot"></span>
        <span id="s-left">无运行终端</span>
        <span class="err" id="s-err" role="alert"></span>
        <span class="spacer"></span>
        <span id="s-dims">— × —</span>
        <button class="tool" id="f-minus" aria-label="缩小字体"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <span class="val" id="f-size">14</span>
        <button class="tool" id="f-plus" aria-label="放大字体"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></button>
      </div>
    </main>
  </div>
</div>

<div class="scrim" id="scrim">
  <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="m-title">
    <h3 id="m-title"></h3><p id="m-text"></p>
    <div class="row"><button class="btn subtle" id="m-cancel">取消</button><button class="btn primary" id="m-ok">确认</button></div>
  </div>
</div>
<div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span id="toast-text"></span></div>

<script>
'use strict'
const $=id=>document.getElementById(id), esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;')

/* ── 模拟数据（对应本机真实历史） ── */
const AGENTS={claude:{name:'Claude Code',short:'Claude',chip:'CL',cls:'chip-claude',dot:'run-claude'},
  codex:{name:'Codex',short:'Codex',chip:'CX',cls:'chip-codex',dot:'run-codex'},
  powershell:{name:'PowerShell',short:'PowerShell',chip:'PS',cls:'',dot:'run-powershell'}}
const WORKSPACES=[
 {path:'D:\\harry\\youchui\\Shuttle',open:true,items:[
  {id:'cf52',agent:'claude',title:'shuttle 项目开发',model:'zcode/GLM-5.3',ago:'刚刚',running:true,status:'busy'},
  {id:'d5ae',agent:'claude',title:'luban skill 创建',model:'glm-5.3',ago:'3 小时前',running:true,status:'idle'}]},
 {path:'D:\\harry\\youchui\\goplay',open:true,items:[
  {id:'e620',agent:'claude',title:'goplay-8a',model:'glm-5.3',ago:'1 小时前',running:false}]},
 {path:'D:\\harry\\youchui\\dsh-plugins',open:true,items:[
  {id:'8c77',agent:'claude',title:'Deepseek 插件开发',model:'glm-5.3-flash',ago:'5 小时前',running:false}]},
 {path:'D:\\hojoai\\code\\hojoai-webmvc-omniasst',open:false,items:[
  {id:'01a1',agent:'codex',title:'看下codex 的这个对话',model:'gpt-6.1-sol',branch:'feature/huaiqing',ago:'1 天前',running:false}]},
 {path:'D:\\douyin_download',open:true,items:[
  {id:'a001',agent:'claude',title:'视频下载器开发与借鉴 magpie 工程规范',model:'group/vibe-coding',branch:'main',ago:'2 天前',running:false}]},
]
const BANNERS={
 powershell:['\x1bPowerShell 7.6.0','','PS D:\\harry\\youchui\\Shuttle> '].map(s=>s.replace('\x1b','')),
 claude:['✻ Welcome to Claude Code 2.1.310','  /clear  /compact  /resume · ↑↓ 选历史',''],
 codex:['codex-cli 0.164.0 · OpenAI Codex（已登录）',''],
}
const PHASES={starting:'正在启动',running:'运行中',stopping:'正在关闭',exited:'已退出'}

/* ── 多标签终端模型：每个标签独立缓冲，并行运行 ── */
let tabs=[], active=null, seq=0, fontSize=14
const sessionTab={}   // 会话 id → 标签 id（已打开则聚焦，不再关旧开新）

function mkTab({agent,title,session,resume}){
  const t={id:++seq,agent,title,phase:'starting',session,resume,typed:'',
    lines:resume?[`> ${agent==='claude'?'claude --resume '+session.id.slice(0,8):'codex resume '+session.id.slice(0,8)}`,'']:[]}
  tabs.push(t); active=t.id
  setTimeout(()=>{t.phase='running';t.prompt=agent==='powershell'?'PS D:\\harry\\youchui\\Shuttle> ':'❯ '
    t.lines=t.lines.concat(BANNERS[agent]);render()},650)
  render();return t
}
function closeTab(id){
  const i=tabs.findIndex(t=>t.id===id); if(i<0)return
  const t=tabs[i]
  if(t.phase==='running'||t.phase==='starting'){
    ask('关闭终端','「'+t.title+'」仍在运行，关闭将终止其中进程。',()=>{
      t.phase='exited';doClose(i);toast('终端已关闭')})
    return
  }
  doClose(i)
}
function doClose(i){
  const t=tabs[i]; if(t.session)delete sessionTab[t.session.id]
  tabs.splice(i,1)
  if(active===t.id)active=tabs[Math.min(i,tabs.length-1)]?.id??null
  render()
}
function openSession(s){
  if(sessionTab[s.id]&&tabs.some(t=>t.id===sessionTab[s.id])){active=sessionTab[s.id];render();toast('聚焦已打开的会话');return}
  const t=mkTab({agent:s.agent,title:s.title,session:s,resume:true})
  sessionTab[s.id]=t.id;toast('在 '+(s.branch?s.branch+' · ':'')+s.title.slice(0,18)+'… 接续')
}

/* ── 渲染 ── */
function renderTabs(){
  const strip=$('tabstrip')
  strip.querySelectorAll('.tab').forEach(e=>e.remove())
  const anchor=$('newtab-btn').parentElement
  for(const t of tabs){
    const el=document.createElement('div')
    el.className='tab'+(t.id===active?' active':'')+(t.phase==='starting'?' starting':'')
    el.setAttribute('role','tab');el.ariaSelected=t.id===active;el.tabIndex=0
    el.innerHTML=`<span class="t-dot ${t.phase==='running'||t.phase==='starting'?AGENTS[t.agent].dot:''}"></span>
      <span class="t-title">${esc(t.title)}</span>
      <span class="t-x" role="button" aria-label="关闭 ${esc(t.title)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></span>
      <span class="t-load"><i></i></span>`
    el.addEventListener('click',e=>{if(e.target.closest('.t-x')){closeTab(t.id)}else{active=t.id;render()}})
    el.addEventListener('auxclick',e=>{if(e.button===1)closeTab(t.id)})
    strip.insertBefore(el,anchor)
  }
  $('newtab-btn').disabled=tabs.length>=8
}
function renderScreen(){
  const t=tabs.find(x=>x.id===active)
  $('term-empty').style.display=t?'none':''
  if(!t){$('screen').innerHTML='';return}
  const lines=t.phase==='running'?t.lines.concat([t.prompt+t.typed]):t.lines
  $('screen').innerHTML=lines.map(l=>l.startsWith('> ')?`<span class="term-accent">${esc(l)}</span>`:esc(l)).join('\n')+(t.phase==='running'?'<span class="c"></span>':'')
  $('screen').scrollTop=$('screen').scrollHeight
}
function renderStatus(){
  const t=tabs.find(x=>x.id===active)
  $('s-dot').className='s-dot'+(t&&t.phase==='running'?' run':'')
  $('s-left').textContent=t?`${AGENTS[t.agent].name} · ${t.title} · ${PHASES[t.phase]??t.phase}`:'无运行终端'
  measure()
}
function render(){renderTabs();renderScreen();renderStatus();renderSessions()}
function measure(){
  const t=tabs.find(x=>x.id===active);const w=$('screen').clientWidth,h=$('screen').clientHeight
  $('s-dims').textContent=t?`${Math.max(20,~~(w/(fontSize*.62)))} × ${Math.max(6,~~(h/(fontSize*1.4)))}`:'— × —'
}

/* ── 会话栏 ── */
function renderSessions(){
  const q=$('q').value.trim().toLowerCase()
  const box=$('sessions');box.innerHTML=''
  let hits=0
  for(const ws of WORKSPACES){
    const items=ws.items.filter(s=>(agentFilter==='all'||s.agent===agentFilter)&&(!q||s.title.toLowerCase().includes(q)||ws.path.toLowerCase().includes(q)||(s.branch||'').includes(q)))
    if(!items.length)continue
    hits+=items.length
    const g=document.createElement('div');g.className='group'+(ws.open?' open':'')
    g.innerHTML=`<button class="group-head" aria-expanded="${ws.open}">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      <span class="path" title="${esc(ws.path)}">${esc(ws.path)}</span><span class="n">${items.length}</span></button>
      <div class="items" style="display:${ws.open?'':'none'}"></div>`
    g.querySelector('.group-head').addEventListener('click',()=>{ws.open=!ws.open;renderSessions()})
    const list=g.querySelector('.items')
    for(const s of items){
      const open=!!sessionTab[s.id]&&tabs.some(t=>t.id===sessionTab[s.id])
      const b=document.createElement('button')
      b.className='sess'+(open&&sessionTab[s.id]===active?' active':'')
      b.innerHTML=`<span class="agent-chip ${AGENTS[s.agent].cls}">${AGENTS[s.agent].chip}</span>
        <span class="sess-main"><span class="sess-title">${esc(s.title)}</span>
        <span class="sess-meta"><span class="ag-${s.agent}">${AGENTS[s.agent].short}</span><span>${s.ago}</span>
        ${s.running&&s.status?`<span class="${s.status==='busy'?'st-busy':'st-idle'}">${s.status}</span>`:''}
        ${s.branch?`<span>${esc(s.branch)}</span>`:''}</span></span>
        ${open?'<svg style="width:13px;height:13px;color:var(--accent)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>':''}`
      b.addEventListener('click',()=>openSession(s))
      list.appendChild(b)
    }
    box.appendChild(g)
  }
  if(!hits)box.innerHTML='<p class="rail-empty">没有匹配「'+esc($('q').value)+'」的会话。</p>'
}
$('q').addEventListener('input',renderSessions)

/* ── Agent 筛选胶囊：由安装检测生成，新 Agent 接入即自动多一颗 ── */
let agentFilter='all'
function renderAgentFilter(){
  const counts={all:0};for(const ws of WORKSPACES)for(const s of ws.items){counts.all++;counts[s.agent]=(counts[s.agent]||0)+1}
  const box=$('agent-filter');box.innerHTML=''
  for(const a of ['all','claude','codex']){
    const b=document.createElement('button')
    b.className=agentFilter===a?'on':''
    b.innerHTML=(a==='all'?'':`<span class="f-dot" style="background:var(--c-${a})"></span>`)+(a==='all'?'全部':AGENTS[a].short)+` <span class="n">${counts[a]||0}</span>`
    b.addEventListener('click',()=>{agentFilter=a;renderAgentFilter();renderSessions()})
    box.appendChild(b)
  }
}
renderAgentFilter()

/* ── 新建终端菜单 ── */
const menu=$('newtab-menu')
$('newtab-btn').addEventListener('click',e=>{e.stopPropagation();menu.classList.toggle('open')})
document.addEventListener('click',()=>menu.classList.remove('open'))
menu.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  const agent=b.dataset.agent
  mkTab({agent,title:AGENTS[agent].name})
  $('term-input').focus()
}))
$('rail-toggle').addEventListener('click',()=>$('rail').classList.toggle('show'))

/* ── 终端输入（IME 安全：真实隐藏输入框路由到当前标签） ── */
$('term-wrap').addEventListener('click',()=>{const t=tabs.find(x=>x.id===active);if(t?.phase==='running')$('term-input').focus()})
$('term-input').addEventListener('input',e=>{const t=tabs.find(x=>x.id===active);if(t){t.typed=e.target.value;renderScreen()}})
$('term-input').addEventListener('keydown',e=>{
  const t=tabs.find(x=>x.id===active);if(!t||t.phase!=='running')return
  if(e.key==='Enter'){e.preventDefault();const cmd=t.typed
    t.lines.push(t.prompt+cmd);t.typed='';$('term-input').value=''
    if(/^(exit|q)$/.test(cmd.trim())){t.phase='exited';t.lines.push('[进程已退出] 标签保留，可关闭')}
    else if(cmd.trim()){t.lines.push('(模拟回显) '+cmd,'')}
    render()}
  else if(e.key==='c'&&e.ctrlKey){e.preventDefault();t.lines.push(t.prompt+t.typed+'^C');t.typed='';$('term-input').value='';renderScreen()}
})

/* ── 字体 ── */
function setFont(d){fontSize=Math.min(24,Math.max(10,fontSize+d));$('screen').style.fontSize=fontSize+'px';$('f-size').textContent=fontSize;measure()}
$('f-minus').addEventListener('click',()=>setFont(-1));$('f-plus').addEventListener('click',()=>setFont(1))

/* ── 快捷键 ── */
document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&!e.altKey){
    const k=e.key.toLowerCase()
    if(k==='k'){e.preventDefault();$('rail').classList.add('show');$('q').focus()}
    else if(k==='t'){e.preventDefault();if(tabs.length<8){mkTab({agent:'powershell',title:'PowerShell'});$('term-input').focus()}}
    else if(k==='w'){e.preventDefault();if(active!=null)closeTab(active)}
    else if(e.key==='Tab'){e.preventDefault();if(tabs.length>1){const i=tabs.findIndex(t=>t.id===active);active=tabs[(i+1)%tabs.length].id;render()}}
  }
})

/* ── 环境检测（模拟） ── */
$('env-btn').addEventListener('click',()=>{
  const dots=[...$('env-dots').children]
  dots.forEach(d=>d.classList.remove('ok'))
  let i=0
  const tick=setInterval(()=>{if(i<dots.length)dots[i++].classList.add('ok');else{clearInterval(tick);toast('环境就绪 · pwsh / claude / codex')}},300)
})

/* ── 弹窗与 toast ── */
let mOk=null
function ask(title,text,onOk){$('m-title').textContent=title;$('m-text').textContent=text;mOk=onOk;$('scrim').classList.add('open')}
$('m-ok').addEventListener('click',()=>{$('scrim').classList.remove('open');mOk?.()})
$('m-cancel').addEventListener('click',()=>$('scrim').classList.remove('open'))
$('scrim').addEventListener('click',e=>{if(e.target===$('scrim'))$('scrim').classList.remove('open')})
$('app-close').addEventListener('click',()=>{
  const running=tabs.filter(t=>t.phase==='running'||t.phase==='starting')
  if(!running.length){toast('再见（预览）');return}
  ask('退出 Shuttle',`还有 ${running.length} 个终端在运行：${running.map(t=>'「'+t.title+'」').join('、')}。退出将全部终止。`,()=>toast('已全部终止并退出（预览）'))
})
let toastTimer=0
function toast(text){$('toast-text').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
window.addEventListener('resize',measure)
renderSessions();render()

/* ── 主题：跟随系统 / 深色 / 浅色（选择存 localStorage，系统模式实时联动） ── */
const mq=matchMedia('(prefers-color-scheme: light)')
let themeMode='system';try{themeMode=localStorage.getItem('shuttle-theme')||'system'}catch{}
function applyTheme(mode,silent){
  themeMode=mode;try{localStorage.setItem('shuttle-theme',mode)}catch{}
  document.documentElement.dataset.theme=mode==='system'?(mq.matches?'light':'dark'):mode
  document.querySelectorAll('.theme-seg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode))
  if(!silent)toast('主题：'+({system:'跟随系统',dark:'深色',light:'浅色'})[mode])
}
document.querySelectorAll('.theme-seg button').forEach(b=>b.addEventListener('click',()=>applyTheme(b.dataset.mode)))
mq.addEventListener?.('change',()=>{if(themeMode==='system')applyTheme('system',true)})
applyTheme(themeMode,true)
</script>
</body>
</html>
